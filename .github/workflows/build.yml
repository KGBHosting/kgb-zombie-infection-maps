name: Build and qualify development maps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated source and original artwork
        run: |
          make generate
          git diff --exit-code -- src assets
      - name: Check public provisioning connectivity
        run: python3 tools/check-ci-network.py
      - name: Build pinned official compiler from source
        run: sh tools/bootstrap-native-ci.sh
      - name: Compile, inspect hulls and run negative controls
        id: maps
        run: |
          sh tools/compile-native-ci.sh build/candidate
          make validate test
          sh tools/compile-native-ci.sh build/repro
          python3 tools/check_repro.py
      - name: Package and verify frozen runtime bytes
        run: |
          python3 tools/package.py
          python3 tools/verify_release.py
      - uses: actions/upload-artifact@v7
        if: always() && steps.maps.outcome == 'success'
        with:
          name: kgb-zombie-infection-maps-${{ github.sha }}
          path: |
            dist/kgb-zombie-infection-maps-0.1.0.zip
            dist/manifest.json
            evidence/qualification.json
            evidence/reproducibility.json
            evidence/ci-toolchain.json
            build/candidate/*.bsp
            build/candidate/*.light.log
          if-no-files-found: error
